[project]
name = "qdrant-modal-embed"
version = "0.1.0"
description = "Fine-tune SPLADE sparse embeddings for e-commerce search with Modal GPU training and Qdrant vector storage"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Qdrant", email = "info@qdrant.tech"},
]
keywords = ["splade", "sparse-embeddings", "e-commerce", "search", "qdrant", "modal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core ML - Sentence Transformers v5+ for SparseEncoder
    "sentence-transformers>=5.0.0",
    "torch>=2.2.0",
    "transformers>=4.45.0",
    # Data
    "datasets>=2.20.0",
    # Qdrant
    "qdrant-client>=1.12.0",
    # FastEmbed for baseline sparse models
    "fastembed>=0.4.0",
    # Modal
    "modal>=0.68.0",
    # Config & Utils
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    # Evaluation
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    # Training acceleration
    "accelerate>=0.30.0",
    "huggingface-hub>=0.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "ipython>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/qdrant/qdrant-modal-embed"
Documentation = "https://qdrant.tech/documentation/"
Repository = "https://github.com/qdrant/qdrant-modal-embed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "ipython>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
