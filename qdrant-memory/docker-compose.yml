# Cortex - Full Stack
# Usage: docker-compose up -d
#
# This starts:
# - Qdrant vector database (port 6333)
# - The MCP server is NOT started here (it's invoked by Claude Code)
#
# To use with Claude Code:
# 1. Start Qdrant: docker-compose up -d qdrant
# 2. Register MCP: claude mcp add cortex -- uvx cortex-mcp start-mcp-server --project "$(pwd)"

version: '3.8'

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: cortex-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Qdrant Web UI (for debugging)
  qdrant-ui:
    image: qdrant/qdrant-web-ui:latest
    container_name: cortex-qdrant-ui
    ports:
      - "6335:80"
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    profiles:
      - ui  # Only start with: docker-compose --profile ui up

volumes:
  qdrant_data:
    name: cortex-qdrant-data
