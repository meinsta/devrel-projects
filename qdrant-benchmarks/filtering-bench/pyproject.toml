[project]
name = "vector-db-filter-bench"
version = "0.1.0"
description = "Filtering performance under load benchmark across managed cloud vector databases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "qdrant-client>=1.12.0",
    "pymilvus>=2.5.0",
    "weaviate-client>=4.9.0",
    "hdrhistogram>=0.10.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9",
    "click>=8.1",
    "h5py>=3.15.1",
]

[tool.hatch.build.targets.wheel]
packages = ["benchmark"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
