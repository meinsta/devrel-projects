[project]
name = "asteroid-qdrant-research"
version = "0.1.0"
description = "Qdrant-native agent toolkit for multi-hop search"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "qdrant-client>=1.17",
    "openai>=1.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fastembed>=0.8.0",
    "wandb>=0.25.1",
]

[project.optional-dependencies]
embeddings = [
    "FlagEmbedding>=1.3",
    "sentence-transformers>=3.0",
]
eval = [
    "datasets>=3.0",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asteroid"]
