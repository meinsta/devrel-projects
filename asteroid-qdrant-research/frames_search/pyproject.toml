[project]
name = "frames-search"
description = "FRAMES multi-hop benchmark with Qdrant retrieval and Context-1-style document tools."
tags = ["search", "frames", "qdrant", "multi-hop", "train", "eval"]
version = "0.2.3"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.8",
    "qdrant-client>=1.17",
    "fastembed>=0.8.0",
    "datasets>=3.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "chonkie>=1.6.1",
    "sentence-transformers>=5.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["__init__.py", "shared.py", "frames_search.py", "sft_env.py", "curriculum.py", "browsecomp_env.py", "retrieval_output.py", "metrics.py", "token_budget.py", "ablations.py", "frames_stages.json", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
