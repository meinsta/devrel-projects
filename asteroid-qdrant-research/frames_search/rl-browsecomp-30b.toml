# BrowseComp+ 30B RL training (the real Context-1 comparison)
# 4-tool retrieval harness, bge-small-en-v1.5 + BM25, answer_found reward
model = "Qwen/Qwen3-30B-A3B-Instruct-2507"
max_steps = 200
batch_size = 8
rollouts_per_example = 4

[sampling]
max_tokens = 2048

[[env]]
id = "thierrydamiba/frames-search"
args = { benchmark = "browsecomp", holdout_frac = 0.25 }

[wandb]
project = "asteroid"
entity = "thierrydamiba"
name = "browsecomp-30b-baseline"

[checkpoints]
interval = 10
