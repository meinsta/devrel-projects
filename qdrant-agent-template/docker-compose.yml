services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  app:
    build: .
    ports:
      - "3489:3489"
    env_file:
      - .env.local
    depends_on:
      - qdrant
    environment:
      - QDRANT_URL=http://qdrant:6333

volumes:
  qdrant_data:
