[project]
name = "qdrant-guide"
version = "0.1.0"
description = "MCP server providing Qdrant documentation tools for Claude Code"
requires-python = ">=3.10"
dependencies = [
    "fastmcp==2.7.0",
    "pydantic>=2.10.6,<2.12.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "markdownify>=0.14.1",
    "qdrant-edge-py>=0.5.0",
    "fastembed>=0.4.0",
]

[project.scripts]
qdrant-guide = "qdrant_guide.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdrant_guide"]

[tool.hatch.build.targets.wheel.force-include]
"src/qdrant_guide/qdrant_docs_map.md" = "qdrant_guide/qdrant_docs_map.md"
"src/qdrant_guide/data" = "qdrant_guide/data"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]
