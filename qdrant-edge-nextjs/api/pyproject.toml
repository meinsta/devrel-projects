[project]
name = "qdrant-edge-api"
version = "0.1.0"
description = "FastAPI backend for Qdrant Edge visual search"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "qdrant-edge-py>=0.1.0",
    "fastembed>=0.7.4",
    "opencv-python>=4.12.0.88",
    "numpy>=2.0.0,<2.3.0",
    "pillow>=11.0.0",
    "scikit-image>=0.26.0",
    "qdrant-client>=1.16.2",
    "python-multipart>=0.0.18",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
